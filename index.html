<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PvP Tier & Match History</title>
  <style>
    :root {
      --bg: #0d0f17;
      --card-bg: #161b26;
      --accent-neon: #00f0ff;
      --accent-green: #00ff66;
      --text: #e2e8f0;
      --border: #2a3447;
      --card-hover: #1e2536;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1, h2 {
      text-align: center;
      color: var(--accent-neon);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      margin-bottom: 15px;
    }
    .section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* タブのスタイル */
    .tab-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: #10141d;
      color: #8892b0;
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95em;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background: var(--card-hover);
      color: #fff;
    }
    .tab-btn.active {
      background: var(--accent-neon);
      color: #0d0f17;
      border-color: var(--accent-neon);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    /* テーブルスタイル */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--accent-neon);
      border-bottom: 2px solid var(--accent-neon);
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* バッジと勝者ハイライト */
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85em;
    }
    .kit-Sword { background: #ff4757; color: #fff; }
    .kit-Axe   { background: #ffa502; color: #fff; }
    .kit-Bow   { background: #2ed573; color: #fff; }
    .kit-UHC   { background: #1e90ff; color: #fff; }

    .winner { color: var(--accent-green); font-weight: bold; }
    .rank-tag { color: #888; font-size: 0.85em; margin-left: 4px; }
    .empty-msg { text-align: center; color: #777; padding: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎮 PvP Competitive Hub</h1>

  <!-- ランキング表示エリア（タブ切り替え付き） -->
  <div class="section">
    <h2>🏆 Kit Rankings</h2>

    <!-- タブボタン -->
    <div class="tab-container">
      <button class="tab-btn active" onclick="switchTab('Sword')">🗡️ Sword</button>
      <button class="tab-btn" onclick="switchTab('Axe')">🪓 Axe</button>
      <button class="tab-btn" onclick="switchTab('Bow')">🏹 Bow</button>
      <button class="tab-btn" onclick="switchTab('UHC')">🍎 UHC</button>
    </div>

    <!-- ランキングテーブル -->
    <table id="ranking-table">
      <thead>
        <tr>
          <th style="width: 20%;">順位</th>
          <th style="width: 80%;">プレイヤー</th>
        </tr>
      </thead>
      <tbody id="ranking-body"></tbody>
    </table>
  </div>

  <!-- 対戦履歴表示エリア -->
  <div class="section">
    <h2>📜 Match History</h2>
    <table>
      <thead>
        <tr>
          <th style="width: 25%;">日時</th>
          <th style="width: 15%;">キット</th>
          <th style="width: 60%;">対戦カード / スコア</th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>
</div>

<!-- 外部データの読み込み -->
<script src="data.js"></script>

<script>
  let currentKit = "Sword";

  // 1. タブ切り替え処理
  function switchTab(kitName) {
    currentKit = kitName;

    // ボタンの見た目を更新
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.remove('active');
      if (btn.textContent.includes(kitName)) {
        btn.classList.add('active');
      }
    });

    // ランキングを再描画
    renderRanking(kitName);
  }

  // 2. 指定されたキットの最新ランキングを描画
  function renderRanking(kitName) {
    const tbody = document.getElementById('ranking-body');
    const latestRanks = {};

    // ログを時系列順に処理して各プレイヤーの最新順位を抽出
    rawMatchLogs.forEach(m => {
      if (m.kit === kitName) {
        latestRanks[m.p1] = m.r1;
        latestRanks[m.p2] = m.r2;
      }
    });

    // 順位（昇順）でソート
    const sorted = Object.entries(latestRanks).sort((a, b) => a[1] - b[1]);

    if (sorted.length === 0) {
      tbody.innerHTML = `<tr><td colspan="2" class="empty-msg">データがありません</td></tr>`;
      return;
    }

    tbody.innerHTML = sorted.map(([player, rank]) => `
      <tr>
        <td><strong>#${rank}</strong></td>
        <td>${player}</td>
      </tr>
    `).join('');
  }

  // 3. 対戦履歴の描画（新しい順）
  function renderHistory() {
    const tbody = document.getElementById('history-body');
    const reversedLogs = [...rawMatchLogs].reverse();

    tbody.innerHTML = reversedLogs.map(m => {
      const isDraw = m.s1 === 0 && m.s2 === 0;
      const p1Win = m.s1 > m.s2;

      return `
        <tr>
          <td style="color:#888; font-size:0.85em;">${m.date}</td>
          <td><span class="badge kit-${m.kit}">${m.kit}</span></td>
          <td>
            <span class="${p1Win ? 'winner' : ''}">${m.p1}</span>
            <span class="rank-tag">(#${m.r1})</span>
            <strong style="margin: 0 6px;">${m.s1} - ${m.s2}</strong>
            <span class="${!p1Win && !isDraw ? 'winner' : ''}">${m.p2}</span>
            <span class="rank-tag">(#${m.r2})</span>
          </td>
        </tr>
      `;
    }).join('');
  }

  // 初期化実行
  renderHistory();
  renderRanking(currentKit);
</script>

</body>
</html>
