<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PvP Tier & Match History</title>
  <style>
    :root {
      --bg: #0d0f17;
      --card-bg: #161b26;
      --accent-neon: #00f0ff;
      --accent-green: #00ff66;
      --text: #e2e8f0;
      --border: #2a3447;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1, h2 {
      text-align: center;
      color: var(--accent-neon);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }
    .section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--accent-neon);
      border-bottom: 2px solid var(--accent-neon);
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85em;
    }
    .kit-Sword { background: #ff4757; color: #fff; }
    .kit-Axe   { background: #ffa502; color: #fff; }
    .kit-Bow   { background: #2ed573; color: #fff; }
    .kit-UHC   { background: #1e90ff; color: #fff; }

    .winner { color: var(--accent-green); font-weight: bold; }
    .rank-tag { color: #888; font-size: 0.9em; margin-left: 4px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎮 PvP Competitive Hub</h1>

  <!-- ランキング表示エリア -->
  <div class="section">
    <h2>🏆 最新ランキング (Sword)</h2>
    <table id="ranking-table">
      <thead>
        <tr>
          <th>順位</th>
          <th>プレイヤー</th>
        </tr>
      </thead>
      <tbody id="ranking-body"></tbody>
    </table>
  </div>

  <!-- 対戦履歴表示エリア -->
  <div class="section">
    <h2>📜 対戦履歴 (Match History)</h2>
    <table>
      <thead>
        <tr>
          <th>日時</th>
          <th>キット</th>
          <th>対戦カード / スコア</th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>
</div>

<!-- external script -->
<script src="data.js"></script>

<script>
  // 1. 対戦履歴の描画（新しい順に表示）
  function renderHistory() {
    const tbody = document.getElementById('history-body');
    // 新しい順にするため配列を反転
    const reversedLogs = [...rawMatchLogs].reverse();

    tbody.innerHTML = reversedLogs.map(m => {
      const isDraw = m.s1 === 0 && m.s2 === 0;
      const p1Win = m.s1 > m.s2;

      return `
        <tr>
          <td style="color:#888; font-size:0.9em;">${m.date}</td>
          <td><span class="badge kit-${m.kit}">${m.kit}</span></td>
          <td>
            <span class="${p1Win ? 'winner' : ''}">${m.p1}</span>
            <span class="rank-tag">(#${m.r1})</span>
            <strong>${m.s1} - ${m.s2}</strong>
            <span class="${!p1Win && !isDraw ? 'winner' : ''}">${m.p2}</span>
            <span class="rank-tag">(#${m.r2})</span>
          </td>
        </tr>
      `;
    }).join('');
  }

  // 2. 最新ランキングの自動抽出と描画 (Swordキットの例)
  function renderRanking(kitName = "Sword") {
    const tbody = document.getElementById('ranking-body');
    const latestRanks = {};

    // ログを順番に読み込み、各プレイヤーの最新順位を上書き保存
    rawMatchLogs.forEach(m => {
      if (m.kit === kitName) {
        latestRanks[m.p1] = m.r1;
        latestRanks[m.p2] = m.r2;
      }
    });

    // 順位順にソート
    const sorted = Object.entries(latestRanks).sort((a, b) => a[1] - b[1]);

    tbody.innerHTML = sorted.map(([player, rank]) => `
      <tr>
        <td><strong>#${rank}</strong></td>
        <td>${player}</td>
      </tr>
    `).join('');
  }

  // 初期化実行
  renderHistory();
  renderRanking("Sword");
</script>

</body>
</html>
