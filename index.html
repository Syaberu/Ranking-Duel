<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYABEPVP - デフォルトPvP Tier & 対戦履歴</title>
  <style>
    :root {
      --bg-dark: #0a0c14;
      --card-bg: #121624;
      --card-hover: #1a2035;
      --accent-purple: #8b5cf6;
      --accent-neon: #00f0ff;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #1f293d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Hiragino Sans', 'Meiryo', 'Inter', system-ui, sans-serif;
      padding-bottom: 50px;
    }

    /* ヘッダー */
    header {
      background: rgba(18, 22, 36, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 0;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .logo-container {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-neon), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .sub-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* タブ切り替え */
    .tab-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      background: #101422;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      min-width: 110px;
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--accent-purple);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
    }

    /* セクションタイトル */
    .section-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
    }

    /* プレイヤーカードグリッド */
    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 40px;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .player-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-purple);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.2);
    }

    .rank-badge {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--accent-neon);
      min-width: 35px;
      text-align: center;
    }

    /* 1位・2位・3位の特別枠線 */
    .player-card.rank-1 { border-color: rgba(255, 215, 0, 0.6); }
    .player-card.rank-1 .rank-badge { color: #ffd700; }
    .player-card.rank-2 { border-color: rgba(192, 192, 192, 0.6); }
    .player-card.rank-2 .rank-badge { color: #c0c0c0; }
    .player-card.rank-3 { border-color: rgba(205, 127, 50, 0.6); }
    .player-card.rank-3 .rank-badge { color: #cd7f32; }

    /* スキン画像表示エリア */
    .skin-avatar {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background-color: #1a2035;
      object-fit: cover;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }

    .player-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 対戦履歴 */
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
    }

    .history-table th, .history-table td {
      padding: 14px 18px;
      text-align: left;
    }

    .history-table th {
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
    }

    .history-table tr {
      border-bottom: 1px solid var(--border-color);
      transition: background 0.15s ease;
    }

    .history-table tr:last-child {
      border-bottom: none;
    }

    .history-table tr:hover {
      background: var(--card-hover);
    }

    /* キットバッジ */
    .kit-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .kit-Sword { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
    .kit-Axe   { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.4); }
    .kit-Bow   { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.4); }
    .kit-UHC   { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.4); }

    .match-player {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .match-skin {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      object-fit: cover;
      background-color: #1a2035;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .match-score {
      font-weight: 800;
      padding: 0 8px;
      color: var(--accent-neon);
    }

    .winner-name {
      color: var(--accent-green);
      font-weight: 700;
    }

    .rank-num {
      color: var(--text-muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="header-inner">
      <div class="logo-container">
        <div class="logo">SYABEPVP</div>
        <div class="sub-tag">デフォルトPvP ランキング</div>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- ランキングセクション -->
    <div class="section-title">🏆 キット別ランキング</div>

    <!-- キット切り替えタブ -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('Sword')">🗡️ 剣 (Sword)</button>
      <button class="tab-btn" onclick="switchTab('Axe')">🪓 斧 (Axe)</button>
      <button class="tab-btn" onclick="switchTab('Bow')">🏹 弓 (Bow)</button>
      <button class="tab-btn" onclick="switchTab('UHC')">🍎 UHC</button>
    </div>

    <!-- ランキングカード表示エリア -->
    <div class="ranking-grid" id="ranking-grid"></div>

    <!-- 対戦履歴セクション -->
    <div class="section-title">📜 対戦履歴</div>
    <div class="history-card">
      <table class="history-table">
        <thead>
          <tr>
            <th style="width: 22%;">日時</th>
            <th style="width: 15%;">キット</th>
            <th style="width: 63%;">対戦結果・スコア</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </div>

  <!-- 対戦ログデータ -->
  <script src="data.js"></script>

  <script>
    let currentKit = "Sword";

    // ローカルのskinsフォルダから画像取得
    function getSkinUrl(playerName) {
      return `skins/${playerName}.png`;
    }

    // 画像が存在しない場合のデフォルトアイコン
    function handleSkinError(img) {
      img.onerror = null;
      img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="%238b5cf6"><rect width="24" height="24" fill="%231a2035"/><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
    }

    // タブ切り替え
    function switchTab(kitName) {
      currentKit = kitName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.includes(kitName)) {
          btn.classList.add('active');
        }
      });
      renderRanking(kitName);
    }

    // ランキング描画
    function renderRanking(kitName) {
      const grid = document.getElementById('ranking-grid');
      const latestRanks = {};

      rawMatchLogs.forEach(m => {
        if (m.kit === kitName) {
          latestRanks[m.p1] = m.r1;
          latestRanks[m.p2] = m.r2;
        }
      });

      const sorted = Object.entries(latestRanks).sort((a, b) => a[1] - b[1]);

      if (sorted.length === 0) {
        grid.innerHTML = `<div style="color:var(--text-muted); padding: 20px;">対戦データがありません</div>`;
        return;
      }

      grid.innerHTML = sorted.map(([player, rank]) => {
        const rankClass = rank <= 3 ? `rank-${rank}` : '';
        return `
          <div class="player-card ${rankClass}">
            <div class="rank-badge">#${rank}</div>
            <img src="${getSkinUrl(player)}" onerror="handleSkinError(this)" alt="${player}" class="skin-avatar">
            <div class="player-name">${player}</div>
          </div>
        `;
      }).join('');
    }

    // 対戦履歴描画
    function renderHistory() {
      const tbody = document.getElementById('history-body');
      const reversedLogs = [...rawMatchLogs].reverse();

      tbody.innerHTML = reversedLogs.map(m => {
        const p1Win = m.s1 > m.s2;
        const isDraw = m.s1 === 0 && m.s2 === 0;

        return `
          <tr>
            <td style="color: var(--text-muted); font-size: 0.85rem;">${m.date}</td>
            <td><span class="kit-badge kit-${m.kit}">${m.kit}</span></td>
            <td>
              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <span class="match-player">
                  <img src="${getSkinUrl(m.p1)}" onerror="handleSkinError(this)" class="match-skin" alt="">
                  <span class="${p1Win ? 'winner-name' : ''}">${m.p1}</span>
                  <span class="rank-num">(#${m.r1})</span>
                </span>
                
                <span class="match-score">${m.s1} - ${m.s2}</span>
                
                <span class="match-player">
                  <img src="${getSkinUrl(m.p2)}" onerror="handleSkinError(this)" class="match-skin" alt="">
                  <span class="${!p1Win && !isDraw ? 'winner-name' : ''}">${m.p2}</span>
                  <span class="rank-num">(#${m.r2})</span>
                </span>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 初期表示
    renderHistory();
    renderRanking(currentKit);
  </script>
</body>
</html>
